services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formulario-dinamico-web
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    networks:
      - formulario-net

networks:
  formulario-net:
    driver: bridge
